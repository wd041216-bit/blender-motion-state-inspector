[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-motion-state-inspector"
version = "0.1.0"
description = "Inspect 3D character state from Blender and generate structured LLM-readable reports"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "..."}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
keywords = ["blender", "3d", "animation", "motion-capture", "retargeting", "llm", "agents", "avatar"]
dependencies = [
  # No runtime deps for core analyzer; optional numpy/scipy in V2
]

[project.urls]
Homepage = "https://github.com/wd041216-bit/blender-motion-state-inspector"
Repository = "https://github.com/wd041216-bit/blender-motion-state-inspector"
Issues = "https://github.com/wd041216-bit/blender-motion-state-inspector/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-blender>=1.0"]

[project.scripts]
blender-state-inspector = "analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["analyzer*", "addon*"]
